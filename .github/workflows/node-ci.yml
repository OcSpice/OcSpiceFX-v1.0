name: Node.js CI

on:
  push:
    branches:
      - step-1-data-pipeline
  pull_request:
    branches:
      - step-1-data-pipeline

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: data-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: data-pipeline/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
